<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIAO IoT API</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280;
    --border: #e3e5e8; --grid: #eceef1; --accent: #f59e0b; --line: #2563eb;
    --ok: #10b981; --off: #d1d5db; --bad: #ef4444; --warn: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --card: #1b1e21; --text: #e8eaed; --muted: #9aa0a6;
      --border: #2c3035; --grid: #25292d; --accent: #fbbf24; --line: #60a5fa;
      --ok: #34d399; --off: #3c4046; --bad: #f87171; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    padding: 24px 16px;
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; }
  h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .who { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .who button { flex: 0 0 auto; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
  .conn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .conn.live i { background: var(--ok); }
  .conn.stale i { background: var(--warn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
  }
  .label { font-size: 13px; color: var(--muted); }
  .state { font-size: 28px; font-weight: 600; }
  .dot {
    width: 64px; height: 64px; border-radius: 50%; background: var(--off);
    transition: background .15s, box-shadow .15s; align-self: center;
  }
  .led.on .dot { background: var(--accent); box-shadow: 0 0 24px var(--accent); }
  .touch.on .dot { background: var(--ok); box-shadow: 0 0 24px var(--ok); }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1; font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1c1e21; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .meter { height: 6px; border-radius: 3px; background: var(--off); overflow: hidden; position: relative; }
  .meter b { position: absolute; inset: 0 auto 0 0; background: var(--ok); width: 0; transition: width .1s; }
  .meter s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
  .small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chart-wrap { position: relative; }
  canvas { display: block; width: 100%; height: 160px; }
  .tip {
    position: absolute; top: 4px; pointer-events: none; display: none;
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 6px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .error { color: var(--bad); min-height: 1em; margin: 0; }

  /* Auth */
  .auth { max-width: 380px; width: 100%; margin: 40px auto 0; }
  .tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; }
  .tabs button { border: 0; background: transparent; padding: 8px; font-size: 14px; }
  .tabs button.active { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  form { display: flex; flex-direction: column; gap: 10px; }
  form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input {
    font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }

  /* API log */
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  #log { margin: 10px 0 0; max-height: 240px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  #log div { padding: 4px 0; border-bottom: 1px solid var(--border); word-break: break-all; }
  #log b { font-weight: 600; }
  #log .ok { color: var(--ok); }
  #log .fail { color: var(--bad); }
  #log span { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>XIAO ESP32-S3<small>FastAPI · Supabase</small></h1>
    <div class="who" id="who" hidden>
      <span id="userEmail"></span>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <!-- Login / sign-up -->
  <section class="card auth" id="authView" hidden>
    <div class="tabs">
      <button id="loginTab" class="active" type="button">로그인</button>
      <button id="signupTab" type="button">회원가입</button>
    </div>
    <form id="authForm">
      <label>이메일 <input id="email" type="email" autocomplete="email" required></label>
      <label>비밀번호 (8자 이상) <input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button class="primary" id="authBtn" type="submit">로그인</button>
    </form>
    <p class="small error" id="authError"></p>
    <p class="small">API 서버: <span id="apiBase"></span> · <a id="docsLink" target="_blank" rel="noopener">API 문서(/docs)</a></p>
  </section>

  <!-- Dashboard -->
  <div id="dashView" hidden>
    <div style="display:flex; flex-direction:column; gap:12px">
      <div class="chart-head">
        <span class="conn" id="board"><i></i><span id="boardText">보드 확인 중</span></span>
        <span class="small" id="seen"></span>
      </div>

      <div class="grid">
        <section class="card led" id="ledCard">
          <span class="label">사용자 LED (GPIO21)</span>
          <div class="dot"></div>
          <span class="state" id="ledState">-</span>
          <div class="row">
            <button id="onBtn" class="primary">켜기</button>
            <button id="offBtn">끄기</button>
            <button id="toggleBtn">토글</button>
          </div>
        </section>
        <section class="card touch" id="touchCard">
          <span class="label">터치 센서 (D0 / GPIO1)</span>
          <div class="dot"></div>
          <span class="state" id="touchState">-</span>
          <div class="meter"><b id="bar"></b><s id="mark"></s></div>
          <span class="small" id="touchValue">값 - / 기준 -</span>
        </section>
      </div>

      <section class="card">
        <div class="chart-head">
          <span class="label">터치 값 기록 (최근 10분, 5초 간격)</span>
          <span class="small">점선 = 터치 기준값</span>
        </div>
        <div class="chart-wrap">
          <canvas id="chart"></canvas>
          <span class="tip" id="tip"></span>
        </div>
      </section>

      <p class="small error" id="dashError"></p>
    </div>
  </div>

  <section class="card">
    <details open>
      <summary>API 호출 로그</summary>
      <div id="log"></div>
    </details>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
